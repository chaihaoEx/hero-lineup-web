server {
    server_name vst2t.i7yun.top;

    root /var/www;
    index index.html;

    location = / {
        return 302 /hero-lineup/;
    }

    # Retire the historical root-scoped PWA worker so it can no longer
    # intercept /issues/ or any other sibling application.
    location = /sw.js {
        alias /var/www/hero-lineup-root-sw-retire.js;
        default_type application/javascript;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /hero-lineup {
        return 308 /hero-lineup/;
    }

    location = /hero-lineup/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /hero-lineup/sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /hero-lineup/manifest.webmanifest {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /hero-lineup/content/manifest.json {
        expires off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /issues {
        return 308 /issues/;
    }

    location = /issues/ {
        return 302 /issues/chaihao/hero-lineup-feedback/issues;
    }

    location ^~ /issues/ {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /issues;
        proxy_redirect off;
    }

    location ^~ /hero-lineup/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /hero-lineup/content/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /hero-lineup/ {
        try_files $uri $uri/ /hero-lineup/index.html;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vst2t.i7yun.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vst2t.i7yun.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name vst2t.i7yun.top;
    return 301 https://$host$request_uri;
}
