name: Web CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-lineup-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --check ops/nginx/root-sw-retire.js
      - name: Build production subpath
        env:
          VITE_BASE_PATH: /hero-lineup/
        run: |
          npm run build
          node tools/validate-subpath-build.mjs dist /hero-lineup/
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Verify production-subpath PWA offline startup
        env:
          VITE_BASE_PATH: /hero-lineup/
        run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: hero-lineup-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://cq.i7yun.cn/hero-lineup/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production subpath
        env:
          VITE_BASE_PATH: /hero-lineup/
        run: npm run build
      - name: Normalize static file permissions
        run: chmod -R a+rX dist
      - name: Configure deploy key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/hero_lineup_deploy
          chmod 600 ~/.ssh/hero_lineup_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          release="/var/www/hero-lineup-web-releases/$RELEASE_SHA"
          ssh -i ~/.ssh/hero_lineup_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          rsync -az --delete -e "ssh -i ~/.ssh/hero_lineup_deploy" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          ssh -i ~/.ssh/hero_lineup_deploy "$DEPLOY_USER@$DEPLOY_HOST" "chmod -R a+rX '$release'"
          ssh -i ~/.ssh/hero_lineup_deploy "$DEPLOY_USER@$DEPLOY_HOST" "ln -sfn '$release' /var/www/hero-lineup-web-current"
          ssh -i ~/.ssh/hero_lineup_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn /var/www/hero-lineup-web-current /var/www/hero-lineup"
      - name: Apply versioned Nginx configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/hero_lineup_deploy ops/nginx/hero-lineup-web.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hero-lineup-web.conf"
          scp -i ~/.ssh/hero_lineup_deploy ops/nginx/root-sw-retire.js \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hero-lineup-root-sw-retire.js"
          ssh -i ~/.ssh/hero_lineup_deploy "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            target=/etc/nginx/conf.d/hero-lineup-web.conf
            backup=/etc/nginx/conf.d/hero-lineup-web.conf.ci-backup
            cp "$target" "$backup"
            install -m 644 /tmp/hero-lineup-root-sw-retire.js /var/www/hero-lineup-root-sw-retire.js
            install -m 644 /tmp/hero-lineup-web.conf "$target"
            if ! nginx -t; then
              cp "$backup" "$target"
              nginx -t
              exit 1
            fi
            systemctl reload nginx
          '
      - name: Verify production
        run: |
          assert_status() {
            expected="$1"
            url="$2"
            actual="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$url expected=$expected actual=$actual"
            test "$actual" = "$expected"
          }
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT

          assert_status 302 https://cq.i7yun.cn/

          echo "Verifying retired root service worker"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$verify_dir/sw.js" https://cq.i7yun.cn/sw.js
          grep --quiet 'hero-lineup-root-worker-retired-v1' "$verify_dir/sw.js"

          echo "Verifying application"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://cq.i7yun.cn/hero-lineup/ >/dev/null

          echo "Verifying content manifest"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output "$verify_dir/manifest.json" https://cq.i7yun.cn/hero-lineup/content/manifest.json
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$verify_dir/manifest.json"

          echo "Verifying static data compression"
          compression_ready=false
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --compressed --head \
              --dump-header "$verify_dir/items.headers" --output /dev/null \
              https://cq.i7yun.cn/hero-lineup/content/TextAsset/items.json
            if grep --ignore-case --extended-regexp --quiet \
              '^content-encoding: (gzip|br)' "$verify_dir/items.headers"; then
              compression_ready=true
              break
            fi
            echo "Compression header not ready (attempt $attempt/6)"
            sleep 2
          done
          if test "$compression_ready" != "true"; then
            cat "$verify_dir/items.headers"
            exit 1
          fi

          echo "Verifying HTTP/2"
          test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_version}' \
            https://cq.i7yun.cn/hero-lineup/)" = "2"

          echo "Verifying issue tracker"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://cq.i7yun.cn/issues/chaihao/hero-lineup-feedback/issues >/dev/null
